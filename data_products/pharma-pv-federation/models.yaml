api-version: data-product.nextdata.com/v1
models:
- name: pv_registry
  description: Registry of the two federated PV tables; anchors the Snowflake credential context.
  sampling:
    method: head
  attributes:
    safety_table:
      data-type: string
      description: Fully-qualified adverse-event summary table.
    commercial_table:
      data-type: string
      description: Fully-qualified prescription-volume table.
    join_keys:
      data-type: string
      description: Join keys shared by both tables.
    safety_row_count:
      data-type: int64
      description: Row count in the safety table at registration time.
    registered_at:
      data-type: string
      description: Timestamp when this row was last refreshed.
- name: get_metadata_request
  description: Request live schema metadata for the two federated PV tables.
  attributes:
    database:
      data-type: string
      description: Optional. Snowflake database.
- name: get_metadata_response
  description: Live metadata for adverse_event_summary and prescription_volume.
  attributes:
    metadata:
      data-type: string
      description: Table schemas, join keys, metric formula, and example query.
    source:
      data-type: string
      description: Source of semantic definitions.
- name: execute_federated_query_request
  description: A SQL SELECT (cross-domain PV JOIN) to run against Snowflake.
  attributes:
    sql:
      data-type: string
      description: A complete SQL SELECT or WITH statement.
- name: execute_federated_query_response
  description: Results of the federated pharmacovigilance query.
  attributes:
    result:
      data-type: string
      description: Query results as a formatted text table.
    row_count:
      data-type: string
      description: Number of rows returned.
