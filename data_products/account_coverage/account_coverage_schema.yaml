# account_coverage_schema.yaml
# Column definitions for PARTNER_AZ_DB.ACCOUNT_COVERAGE.ACCOUNT_COVERAGE
#
# This file is the single source of truth for column descriptions surfaced
# by the get_schema MCP tool. Update descriptions here and run nxd launch
# to push changes -- no code change needed in __mcp__.py.
#
# Keep in sync with models.py (which drives the Snowflake column COMMENTs
# and the platform semantic model registration).

table:
  database: PARTNER_AZ_DB
  schema: ACCOUNT_COVERAGE
  name: ACCOUNT_COVERAGE
  grain: one row per CRM account

columns:
  - name: account_id
    type: VARCHAR
    description: "Unique CRM account identifier. Joins to crm-activity account.account_id."

  - name: account_value_tier
    type: VARCHAR
    description: "Strategic value tier. Allowed values: 'High', 'Medium', 'Low'."

  - name: segment
    type: VARCHAR
    description: "Field-force segment: 'A', 'B', 'C', 'D'. Segment A = highest strategic priority; D = lowest."

  - name: specialty
    type: VARCHAR
    description: "Primary medical specialty (e.g. 'Cardiology', 'Oncology', 'Primary Care', 'Neurology')."

  - name: territory_id
    type: VARCHAR
    description: "Sales territory (e.g. 'T-01', 'T-02'). NOTE: always exclude territory_id = 'T-MKT' from field-rep analysis -- it is a marketing territory, not a field sales territory."

  - name: potential_value_usd
    type: NUMBER
    description: "Total estimated addressable revenue opportunity for this account, USD."

  - name: actual_value_usd
    type: NUMBER
    description: "Realized revenue attributed to this account, USD."

  - name: value_gap_usd
    type: NUMBER
    description: "Unrealized revenue opportunity: potential_value_usd minus actual_value_usd. Higher = greater upside. Use for prioritisation and ranking queries."

  - name: realization_ratio
    type: DECIMAL(6,4)
    description: "actual_value_usd / potential_value_usd. Range 0-1 (returns 0 when potential = 0). Multiply by 100 for percentage display: ROUND(realization_ratio * 100, 1)."

  - name: touch_count
    type: NUMBER
    description: "Total number of field activities (calls, visits, samples, etc.) logged against this account."

  - name: total_cost_usd
    type: NUMBER
    description: "Total estimated fully-loaded cost of all field activities for this account, USD."

  - name: avg_engagement_score
    type: DECIMAL(6,2)
    description: "Mean engagement quality score across all the account's activities. Range 0-100. Higher = stronger engagement quality."

  - name: positive_rate
    type: DECIMAL(6,4)
    description: "Fraction of the account's activities that received a Positive response. Range 0-1. Multiply by 100 for percentage display."

  - name: coverage_flag
    type: VARCHAR
    description: "Coverage classification derived from tier, value, and activity patterns. Allowed values: 'Under-served high-value' | 'Over-served low-value' | 'Well-served high-value' | 'Adequate'."

  - name: account_profile_text
    type: VARCHAR
    description: "Auto-generated natural language profile combining all account attributes. Indexed by the ACCOUNT_COVERAGE_SEARCH Cortex Search service. Do not use this column in SQL WHERE clauses."
