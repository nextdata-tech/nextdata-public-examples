api-version: data-product.nextdata.com/v1
models:
- name: prescription_volume
  description: Prescription volume per product, region, and reporting period (synthetic).
  sampling:
    method: head
  attributes:
    product_id:
      data-type: string
      description: Product identifier. Federated join key.
    product_name:
      data-type: string
      description: Brand name of the product (fictional).
    region:
      data-type: string
      description: Geographic region. Join key.
    report_period:
      data-type: string
      description: Reporting quarter. Join key.
    total_prescriptions:
      data-type: int64
      description: Total prescriptions (TRx) — exposure denominator.
    new_prescriptions:
      data-type: int64
      description: New prescriptions (NRx).
    patient_count:
      data-type: int64
      description: Distinct patients treated.
    units_dispensed:
      data-type: int64
      description: Total units dispensed.
    avg_days_of_therapy:
      data-type: float64
      description: Average days of therapy per patient.
    prescriber_count:
      data-type: int64
      description: Distinct prescribers.
