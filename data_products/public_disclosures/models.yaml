# yaml-language-server: $schema=../../../../../representations/runtime/json-schema/v1/models.json
api-version: data-product.nextdata.com/v1
models:
  - attributes:
      document_id:
        data-type: string
        description: Unique identifier assigned to the disclosure document in the system.
      company:
        data-type: string
        description: Name of the financial institution or entity publishing the APS 330 Public Disclosure.
      filename:
        data-type: string
        description: Original filename of the uploaded or processed document.
      url:
        data-type: string
        description: Direct link to the document source or downloadable file.
      contents:
        data-type: string
        description: Full extracted text content of the PDF disclosure.
      pages:
        data-type: int
        description: Total number of pages in the disclosure document.
      tables:
        data-type: int
        description: Count of tabular data elements extracted from the document.
      doc_elements:
        data-type: int
        description: Total number of structured elements (e.g., headings, paragraphs, tables, lists) identified in the parsed output.
      document_hash:
        data-type: string
        description: Cryptographic hash of the document file used to verify integrity and detect duplicates.
      size:
        data-type: int
        description: File size of the document in bytes.
      processed_at:
        data-type:
          timestamp:
            timezone: null
            unit: ns
        description: Timestamp of when the document was parsed and processed, stored in nanosecond precision.
    description: Parsed representation of APS 330 Public Disclosure documents, including metadata, extracted text, and structural elements for analysis.
    name: disclosures
    sampling:
      method: head
