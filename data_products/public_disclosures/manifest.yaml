# yaml-language-server: $schema=../../../../../representations/runtime/json-schema/v1/manifest.json
description: Parsed representation of public Disclosure documents for competitor analysis, covering metadata, extracted text, and structural elements for analysis
domain: FINANCE/COMPETITORS/REGULATORY-COMPLIANCE
executor:
  config:
    script: transform/__transform__.py
    pod_cleanup_delay_secs: 120
  driver: nxd:kubernetes/compute:1.0.0
inputs:
  triggers:
    - cronSchedule: 0 6 1 */3 *
metadata:
  repository: https://github.com/nextdata-tech/nextdata-examples
name: public-disclosures
output:
  models:
    - url: disclosures
      visibility: public
  ports:
    # TODO: move to pgvector
    # pinecone:
    #   config:
    #     index: finance-documents-pilot
    #     namespace: aps-330-public-disclosures-disclosures
    #   service: nxd-pinecone
    adls:
      config:
        format: parquet
        enable_temporal_credentials: true
        skip_governance_flow: true
      promises:
        model:
          - disclosures
      service: adls
policies:
  - name: owner
    principals:
      - user: hello@nextdata.com
    resources:
      - kind: owner
  - name: data-product-access
    principals:
      - user: hello@nextdata.com
    resources:
      - kind: dataProduct
  - name: steward
    principals:
      - user: hello@nextdata.com
    resources:
      - kind: dataProduct
version: 1.0.0-dev
